    <!-- Google Analytics 4 — G-9BZH43CTN3 -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-9BZH43CTN3"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}

  <body>
    <!-- Capture beforeinstallprompt before React loads to avoid race condition -->
    <script>
      window.__pwaPrompt = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.__pwaPrompt = e;
        console.log('[PWA] beforeinstallprompt captured globally');
        // Notify any already-mounted React listener
        window.dispatchEvent(new CustomEvent('pwa-prompt-ready'));
      });
      window.addEventListener('appinstalled', function() {
        window.__pwaPrompt = null;
        console.log('[PWA] app installed — prompt cleared');
      });
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
